services:
  - type: web
    name: epsu-site
    runtime: static
    staticPublishPath: .
    routes:
      - type: redirect
        source: /auth/confirm
        destination: /auth-confirm.html
      - type: redirect
        source: /auth/confirm/
        destination: /auth-confirm.html
      - type: redirect
        source: /reset-password
        destination: /reset-password.html
      - type: redirect
        source: /reset-password/
        destination: /reset-password.html
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
